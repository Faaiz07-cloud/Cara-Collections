{% extends 'master.html' %}

{% load static %}

{% block title %}
Edit Profile
{% endblock %}

{% block content %}

<div class="edit-profile-container">
    <h2>Edit Profile</h2>

    <form method="POST" enctype="multipart/form-data" class="edit-profile-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn save-btn">Save Changes</button>
    </form>
</div>

{% endblock %}
