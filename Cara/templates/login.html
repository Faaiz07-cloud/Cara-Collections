{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cara | Login</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- MDB CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.css"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>

    <!-- Login -->
    <section class="login-section">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-xl-10 col-lg-12 col-md-9">
            <div class="card login-card shadow-lg">
              <div class="row g-0">
                <!-- Left Image -->
                <div class="col-md-6 d-none d-md-block">
                  <img
                    src="{% static 'img/banner/brunette-girl-street-coffee-coat-brown-leather-bag_231208-2807.avif' %}"
                    alt="login form"
                    class="login-img"
                  />
                </div>

                <!-- Right Form -->
                <div class="col-md-6 d-flex align-items-center">
                  <div class="card-body p-5">
                    <form method="post"
                      class="h-auto d-flex flex-column justify-content-center"
                    >
                      {% csrf_token %}
                      <!-- Logo -->
                      <div class="d-flex align-items-center mb-4">
                        <i class="fas fa-cubes fa-2x me-3 logo-icon"></i>
                        <span class="h1 fw-bold mb-0">Cara</span>
                      </div>

                      <!-- Heading -->
                      <h5 class="login-heading mb-4">Sign into your account</h5>

                      <!-- Username -->
                      <div data-mdb-input-init class="form-outline mb-4">
                        {{ form.username }}
                        <label class="form-label" for="form2Example17"
                          >Username</label
                        >
                        <small class="text-danger">{{ form.username.errors }}</small>
                      </div>

                      <!-- Password -->
                      <div data-mdb-input-init class="form-outline mb-4">
                        {{ form.password }}
                        <label class="form-label" for="form2Example27"
                          >Password</label
                        >
                        <small class="text-danger">{{ form.password.errors }}</small>
                      </div>

                      <!-- Login Button -->
                      <div class="mb-4">
                        <button
                          data-mdb-button-init
                          data-mdb-ripple-init
                          class="btn btn-dark btn-lg w-100"
                          type="submit"
                        >
                          Login
                        </button>
                      </div>

                      <!-- Extra Links -->
                      <a class="small text-muted" href="{% url 'password_reset' %}">Forgot password?</a>
                      <p class="login-text mt-3">
                        Don't have an account?
                        <a href="{% url 'signup' %}">SignUp</a>
                      </p>
                      <a href="#!" class="small text-muted me-2"
                        >Terms of use.</a
                      >
                      <a href="#!" class="small text-muted">Privacy policy</a>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Login -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"></script>
  </body>
</html>
